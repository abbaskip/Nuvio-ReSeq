name: Stability emulator verification

# Deliberately independent of publication. Dispatch after the Phase 1 base is agreed.
on:
  workflow_dispatch:
    inputs:
      workload:
        description: 'Full baseline or existing instrumentation only'
        type: choice
        default: full
        options: [full, instrumentation, profile, compare, regressions, review-regressions, followup, playback, recording, reminder, first-card, rollback, rollback-play, storage-pressure, guide-delivery, shared-features, college-restart, channel-shortcut, compiled-size, public-upgrade, stream-picker, profile-sources, sports-delivery, profile-cost, release-profile-cost, measure-release-profiles, profile-ui]
      expected_tag:
        description: 'Expected public Latest release for the in-app upgrade test'
        type: string
      signed_run:
        description: 'Completed signed integration workflow for guide playback verification'
        type: string
        default: '44645609882'
      review_ref:
        description: 'Integration or bisect commit for follow-up measurements'
        type: string
        default: '6c80c0106ce07dae3cb08576ce45e6a5c541857c'
      ram_tiers:
        description: 'RAM tiers in MB; select one to repeat a failed tier'
        type: choice
        default: '[2048,3072,4096]'
        options:
          - '[2048,3072,4096]'
          - '[2048]'
          - '[3072]'
          - '[4096]'

permissions:
  contents: read

jobs:
  public-upgrade:
    if: inputs.workload == 'public-upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      EXPECTED_TAG: ${{ inputs.expected_tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Get the previous signed beta and public update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/public-upgrade
          gh release download v0.1.0-beta.10.12 --repo "$GITHUB_REPOSITORY" --pattern '*-x86_64.apk' --dir build/public-upgrade
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > build/public-upgrade/latest.json
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: tv_1080p
          ram-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: python3 -u scripts/performance-fixtures/public_upgrade.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: signed-in-app-upgrade
          path: build/public-upgrade/results.json

  profile-ui:
    if: inputs.workload == 'profile-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - screen: settings
            shard: 0
          - screen: detail
            shard: 2
    steps:
      - uses: actions/checkout@v6
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Prepare original DEX and optimizer-produced test profiles
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
        run: |
          gh run download 44579904228 --repo "$GITHUB_REPOSITORY" --pattern '*verified-apks' --dir build/profile-ui/apks
          for part in control "$SHARD"; do
            gh run download 44644271540 --repo "$GITHUB_REPOSITORY" --name "r8-profile-$part" --dir build/profile-ui/metadata
          done
          bash scripts/performance-fixtures/observer/build.sh
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          UI_MODE: ${{ matrix.screen }}
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: tv_1080p
          ram-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: python3 -u scripts/performance-fixtures/profile_ui.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: profile-ui-${{ matrix.screen }}
          path: |
            build/profile-ui/samples.json
            build/profile-ui/failure.*

  stream-picker:
    if: inputs.workload == 'stream-picker'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        first-size: [small, large]
    steps:
      - uses: actions/checkout@v6
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Prepare the signed app and guest-only accessibility observer
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_RUN: ${{ inputs.signed_run }}
        run: |
          [[ "$SIGNED_RUN" =~ ^[0-9]+$ ]]
          test "$(gh run view "$SIGNED_RUN" --repo "$GITHUB_REPOSITORY" --json headBranch,workflowName --jq '[.headBranch,.workflowName]|join("|")')" = 'perf-integration|ReSeq signed APK release'
          gh run download "$SIGNED_RUN" --repo "$GITHUB_REPOSITORY" --pattern '*verified-apks' --dir build/guide-apks
          bash scripts/performance-fixtures/observer/build.sh
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          FIRST_SIZE: ${{ matrix.first-size }}
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: tv_1080p
          ram-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: python3 -u scripts/performance-fixtures/stream_picker.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stream-picker-${{ matrix.first-size }}-first
          path: |
            build/stream-picker/results.json
            build/stream-picker/failure.*

  guide-delivery:
    if: contains(fromJSON('["guide-delivery","shared-features","college-restart","channel-shortcut","compiled-size"]'), inputs.workload)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: android-actions/setup-android@v3
        with:
          packages: ${{ inputs.workload == 'shared-features' && 'platform-tools platforms;android-36 build-tools;36.0.0' || 'platform-tools' }}
          log-accepted-android-sdk-licenses: false
      - name: Build the disposable guest UI observer
        if: inputs.workload == 'shared-features'
        run: bash scripts/performance-fixtures/observer/build.sh
      - name: Get the signed integration APK and generate the live television fixture
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_RUN: ${{ inputs.signed_run }}
        run: |
          [[ "$SIGNED_RUN" =~ ^[0-9]+$ ]]
          test "$(gh run view "$SIGNED_RUN" --repo "$GITHUB_REPOSITORY" --json headBranch,workflowName --jq '[.headBranch,.workflowName]|join("|")')" = 'perf-integration|ReSeq signed APK release'
          gh run download "$SIGNED_RUN" --repo "$GITHUB_REPOSITORY" --pattern '*verified-apks' --dir build/guide-apks
          if ! command -v ffmpeg; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          mkdir -p build/guide-delivery
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=256x144:rate=25 -f lavfi -i sine=frequency=440 -t 300 -c:v libx264 -preset ultrafast -b:v 220k -g 50 -c:a aac -b:a 64k -f mpegts build/guide-delivery/live.ts
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Get the reference beta for the in-place ART size comparison
        if: inputs.workload == 'compiled-size'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download 'v0.1.0-beta.10.12' --repo "$GITHUB_REPOSITORY" --pattern '*-x86_64.apk' --dir build/reference-apks
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: tv_1080p
          ram-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: python3 -u scripts/performance-fixtures/${{ inputs.workload == 'shared-features' && 'shared_features.py' || inputs.workload == 'college-restart' && 'sports_actions.py college-restart' || inputs.workload == 'channel-shortcut' && 'sports_actions.py channel-shortcut' || inputs.workload == 'compiled-size' && 'signed_compiled_size.py' || 'guide_delivery.py' }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: signed-${{ inputs.workload }}-results
          path: |
            build/guide-delivery/results.json
            build/compiled-size/results.json
            build/shared-features/results.json
            build/shared-features/*/failure.*
            build/sports-actions/

  profile-reference:
    if: inputs.workload == 'release-profile-cost'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/r8-profile-variant
        with:
          shard: control
          config: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          cache-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  profile-groups:
    needs: profile-reference
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/r8-profile-variant
        with:
          shard: ${{ matrix.shard }}
          config: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          cache-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  profile-release-guest:
    needs: profile-groups
    if: always() && (inputs.workload == 'measure-release-profiles' || (inputs.workload == 'release-profile-cost' && needs.profile-groups.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v6
        with:
          run-id: ${{ inputs.workload == 'measure-release-profiles' && '44644271540' || github.run_id }}
          github-token: ${{ github.token }}
          pattern: r8-profile-*
          merge-multiple: true
          path: build/profile-cost/metadata
      - name: Prepare the original signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44579904228 --repo "$GITHUB_REPOSITORY" --name 'ReSeq-0.1.0-beta.10.12-verified-apks' --dir build/profile-cost/apks
          cp build/profile-cost/apks/*-x86_64.apk build/profile-cost/base.apk
          echo '85536b91337ac7b87fef53d9a3fd120da9e427e508cedefd5bbec47642b0b6f2  build/profile-cost/base.apk' | sha256sum -c -
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: tv_1080p
          ram-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: python3 -u scripts/performance-fixtures/profile_cost.py measure
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release-wildcard-cost-evidence
          path: build/profile-cost/odex.json

  profile-cost:
    if: inputs.workload == 'profile-cost'
    runs-on: ubuntu-latest
    timeout-minutes: 155
    permissions:
      contents: read
      actions: read
    env:
      CI_USE_DEBUG_SIGNING: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Build matching profile variants for the original signed DEX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44579904228 --repo "$GITHUB_REPOSITORY" --name 'ReSeq-0.1.0-beta.10.12-verified-apks' --dir build/profile-cost/apks
          gh run download 44579904228 --repo "$GITHUB_REPOSITORY" --name 'ReSeq-0.1.0-beta.10.12-r8-mapping' --dir build/profile-cost/mapping
          ./gradlew :app:mergeFullReleaseArtProfile --max-workers=2 -PuseLocalFfmpegDecoder=false
          python3 -u scripts/performance-fixtures/profile_cost.py prepare
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: tv_1080p
          ram-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: python3 -u scripts/performance-fixtures/profile_cost.py measure
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: wildcard-cost-evidence
          path: |
            build/profile-cost/groups.json
            build/profile-cost/odex.json
            build/profile-cost/metadata/
          retention-days: 14

  delivery-build:
    if: inputs.workload == 'sports-delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        side: [published, integration]
    env:
      CI_USE_DEBUG_SIGNING: 'true'
      REVIEW_REF: ${{ inputs.review_ref }}
      SIDE: ${{ matrix.side }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use identical observations in both minified targets
        run: |
          ref="$REVIEW_REF"
          if [[ "$SIDE" == published ]]; then ref=v0.1.0-beta.10.12; fi
          git checkout --detach "$ref"
          fixture=app/src/stabilityFixtures/java/com/nuvio/tv/profiling/StabilityJourneyActivity.kt
          git show "$GITHUB_SHA:$fixture" > "$fixture"
          sed -i 's/"matches" to matches.size,/"matches" to matches.size, "hasChannel" to matches.values.any { it.isNotEmpty() },/' "$fixture"
          grep -q '"hasChannel"' "$fixture"
          git show "$GITHUB_SHA:scripts/performance-fixtures/SportsDeliveryTest.kt" > baselineprofile/src/main/java/com/nuvio/tv/baselineprofile/SportsDeliveryTest.kt
          sed -i 's/namespace = "com.nuvio.tv.baselineprofile"/namespace = "com.nuvio.tv.delivery.runner"/' baselineprofile/build.gradle.kts
      - uses: ./.github/actions/gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Package minified ARM and x86 targets with the test runner
        run: |
          ./gradlew :app:assembleFullBenchmark :baselineprofile:assembleBenchmarkRelease --max-workers=2 -PstabilityFixtures=true -PuseLocalFfmpegDecoder=false -Pkotlin.compiler.execution.strategy=in-process
          mkdir -p build/delivery
          cp app/build/outputs/apk/full/benchmark/*-armeabi-v7a-benchmark.apk build/delivery/arm.apk
          cp app/build/outputs/apk/full/benchmark/*-x86-benchmark.apk build/delivery/x86.apk
          cp "$(find baselineprofile/build/outputs/apk -name '*-benchmarkRelease.apk')" build/delivery/runner.apk
          unzip -t build/delivery/arm.apk assets/dexopt/baseline.prof
          git rev-parse HEAD > build/delivery/application-revision.txt
      - uses: actions/upload-artifact@v6
        with:
          name: delivery-${{ matrix.side }}
          path: build/delivery/
          retention-days: 5
          compression-level: 0

  delivery-guest:
    needs: delivery-build
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: delivery-published
          path: build/delivery/published
      - uses: actions/download-artifact@v6
        with:
          name: delivery-integration
          path: build/delivery/integration
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: python3 -u scripts/performance-fixtures/sports_delivery.py --serial emulator-5554 --abi x86 --apks build/delivery --output build/delivery-evidence
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sports-delivery-evidence
          path: build/delivery-evidence/

  profile-sources:
    if: inputs.workload == 'profile-sources'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI_USE_DEBUG_SIGNING: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Build the isolated two-profile functional test
        run: |
          sed -i 's/io.github.abbaskip.nuvioreseq.iptvdebug/io.github.abbaskip.nuvioreseq.debug/' app/build.gradle.kts
          cp scripts/performance-fixtures/ProfileSourcesFixtureEntryPoint.kt app/src/debug/java/com/nuvio/tv/
          cp scripts/performance-fixtures/ProfileSourcesDeviceTest.kt app/src/androidTest/java/com/nuvio/tv/livetv/storage/
          ./gradlew :app:assembleFullDebug :app:assembleFullDebugAndroidTest --max-workers=2 -PstabilityFixtures=true -PuseLocalFfmpegDecoder=false -Pkotlin.compiler.execution.strategy=in-process
          mkdir -p build/profile-sources
          cp app/build/outputs/apk/full/debug/*-armeabi-v7a-debug.apk build/profile-sources/arm.apk
          cp app/build/outputs/apk/full/debug/*-x86-debug.apk build/profile-sources/x86.apk
          cp app/build/outputs/apk/androidTest/full/debug/*.apk build/profile-sources/test.apk
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/upload-artifact@v6
        with:
          name: profile-sources-device-test
          path: |
            build/profile-sources/arm.apk
            build/profile-sources/test.apk
          compression-level: 0
          retention-days: 4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            adb -s emulator-5554 install -t build/profile-sources/x86.apk
            adb -s emulator-5554 install -t build/profile-sources/test.apk
            adb -s emulator-5554 shell am instrument -w -r -e class com.nuvio.tv.livetv.storage.ProfileSourcesDeviceTest io.github.abbaskip.nuvioreseq.debug.test/androidx.test.runner.AndroidJUnitRunner > build/profile-sources/test.txt
            cat build/profile-sources/test.txt
            grep -Eq '^OK \(1 test\)' build/profile-sources/test.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: profile-sources-result
          path: build/profile-sources/test.txt
          if-no-files-found: warn

  rollback:
    if: inputs.workload == 'rollback' || inputs.workload == 'rollback-play' || inputs.workload == 'storage-pressure'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Download the three original signed packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for beta in 10.12 10.11; do
            gh release download "v0.1.0-beta.$beta" --repo "$GITHUB_REPOSITORY" --pattern '*-x86_64.apk' --dir "build/rollback-apks/$beta"
          done
          gh run download 44579904228 --repo "$GITHUB_REPOSITORY" --name 'ReSeq-0.1.0-beta.10.12-verified-apks' --dir build/rollback-apks/integration
          python3 -u scripts/performance-fixtures/signed_rollback.py --apks-only
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: tv_1080p
          ram-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: python3 -u scripts/performance-fixtures/${{ inputs.workload == 'storage-pressure' && 'storage_pressure.py' || inputs.workload == 'rollback-play' && 'signed_rollback.py --play-window' || 'signed_rollback.py' }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: signed-rollback-results
          path: |
            build/signed-rollback
            build/storage-pressure/results.json
          if-no-files-found: warn
          retention-days: 14

  first-card:
    if: inputs.workload == 'first-card'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      CI_USE_DEBUG_SIGNING: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Build the accessibility timing test and reuse the minified comparison targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for side in published integration; do
            gh run download 44578442446 --repo "$GITHUB_REPOSITORY" --name "comparison-$side" --dir "build/comparison/$side"
          done
          cp scripts/performance-fixtures/SportsFirstCardTest.kt baselineprofile/src/main/java/com/nuvio/tv/baselineprofile/
          ./gradlew :baselineprofile:assembleBenchmarkRelease --max-workers=2 -PuseLocalFfmpegDecoder=false -Pkotlin.compiler.execution.strategy=in-process
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash scripts/performance-fixtures/first_card_compare.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sports-first-card-results
          path: build/sports-first-card
          retention-days: 14

  regressions:
    if: inputs.workload == 'regressions' || inputs.workload == 'review-regressions' || inputs.workload == 'followup' || inputs.workload == 'playback' || inputs.workload == 'recording' || inputs.workload == 'reminder'
    runs-on: ubuntu-latest
    timeout-minutes: 115
    strategy:
      fail-fast: false
      matrix:
        side: ${{ inputs.workload == 'review-regressions' && fromJSON('["integration"]') || fromJSON('["published","integration"]') }}
    env:
      CI_USE_DEBUG_SIGNING: 'true'
      PERF_DEVICE_WORKLOAD: ${{ inputs.workload == 'review-regressions' && 'regressions' || inputs.workload }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use the published application and all of its original tests
        if: matrix.side == 'published'
        run: |
          git checkout --detach v0.1.0-beta.10.12
          git show "$GITHUB_SHA:scripts/performance_regressions.sh" > scripts/performance_regressions.sh
          git show "$GITHUB_SHA:scripts/performance_state_playback.sh" > scripts/performance_state_playback.sh
          git show "$GITHUB_SHA:scripts/stability_run.py" > scripts/stability_run.py
          fixture=app/src/stabilityFixtures/java/com/nuvio/tv/profiling/StabilityJourneyActivity.kt
          git show "$GITHUB_SHA:$fixture" > "$fixture"
      - name: Prepare the identical synthetic recording for both apps
        if: inputs.workload == 'recording'
        run: |
          testsrc=app/src/androidTest/java/com/nuvio/tv/livetv/storage/ClosedRecordingDeviceTest.kt
          git show "$GITHUB_SHA:scripts/performance-fixtures/ClosedRecordingDeviceTest.kt" > "$testsrc"
          mkdir -p app/src/androidTest/assets
          if ! command -v ffmpeg; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=160x96:rate=10 -t 10 -an -c:v libx264 -threads 1 -g 20 -pix_fmt yuv420p -f mpegts app/src/androidTest/assets/closed-recording.ts
      - uses: ./.github/actions/gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Build isolated fixture app and on-device tests
        run: |
          tasks=(:app:assembleFullBenchmark)
          if [[ "$PERF_DEVICE_WORKLOAD" == regressions ]]; then tasks+=(:app:assembleFullDebug :app:assembleFullDebugAndroidTest); fi
          if [[ "$PERF_DEVICE_WORKLOAD" == recording ]]; then tasks=(:app:assembleFullDebug :app:assembleFullDebugAndroidTest); fi
          ./gradlew "${tasks[@]}" --max-workers=2 -PstabilityFixtures=true -PuseLocalFfmpegDecoder=false -Pkotlin.compiler.execution.strategy=in-process
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Continue Watching, TVDB and Sports journeys and device regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash scripts/performance_regressions.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: performance-regression-results-${{ matrix.side }}
          path: |
            build/performance-regressions/
            app/build/outputs/androidTest-results/
          retention-days: 14

  comparison-build:
    if: inputs.workload == 'compare'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        side: [published, integration]
    env:
      CI_USE_DEBUG_SIGNING: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select application revision and identical fixture activity
        if: matrix.side == 'published'
        run: |
          fixture=app/src/profileFixtures/java/com/nuvio/tv/profiling/ReSeqJourneyActivity.kt
          git checkout --detach 'v0.1.0-beta.10.12'
          git show "$GITHUB_SHA:$fixture" > "$fixture"
      - uses: ./.github/actions/gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Build minified non-debuggable comparison and runner
        run: |
          # Use a separate application ID on both sides so the same builds can run alongside a populated release on a TV.
          sed -i 's/applicationId = "io.github.abbaskip.nuvioreseq"/applicationId = "io.github.abbaskip.nuvioreseq.perfcomparison"/' app/build.gradle.kts
          sed -i 's/DEFAULT_TARGET_PACKAGE = "io.github.abbaskip.nuvioreseq"/DEFAULT_TARGET_PACKAGE = "io.github.abbaskip.nuvioreseq.perfcomparison"/' baselineprofile/src/main/java/com/nuvio/tv/baselineprofile/NuvioUi.kt
          grep -Fq 'applicationId = "io.github.abbaskip.nuvioreseq.perfcomparison"' app/build.gradle.kts
          printf '%s\n' 'NUVIO_SUPABASE_URL=http://127.0.0.1:38791/' 'NUVIO_SUPABASE_ANON_KEY=comparison-fixture' > local.properties
          ./gradlew :app:assembleFullBenchmarkRelease :baselineprofile:assembleBenchmarkRelease --max-workers=2 -PuseLocalFfmpegDecoder=false -Pkotlin.compiler.execution.strategy=in-process
          mkdir -p build/comparison-output
          mapfile -t target < <(find app/build/outputs/apk -name '*-x86-benchmarkRelease.apk')
          mapfile -t runner < <(find baselineprofile/build/outputs/apk -name '*-benchmarkRelease.apk')
          test "${#target[@]}" = 1 && test "${#runner[@]}" = 1
          cp "${target[0]}" build/comparison-output/target.apk
          cp "${runner[0]}" build/comparison-output/runner.apk
          mapfile -t arm < <(find app/build/outputs/apk -name '*-armeabi-v7a-benchmarkRelease.apk')
          test "${#arm[@]}" = 1
          mkdir -p build/comparison-arm
          cp "${arm[0]}" build/comparison-arm/target.apk
          echo "$GITHUB_SHA" > build/comparison-arm/workflow-revision.txt
          git rev-parse HEAD > build/comparison-arm/application-revision.txt
      - uses: actions/upload-artifact@v6
        with:
          name: comparison-arm-${{ matrix.side }}
          path: build/comparison-arm/
          retention-days: 2
          compression-level: 0
      - uses: actions/upload-artifact@v6
        with:
          name: comparison-${{ matrix.side }}
          path: build/comparison-output/
          retention-days: 1
          compression-level: 0

  comparison:
    needs: comparison-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: comparison-published
          path: build/comparison/published
      - uses: actions/download-artifact@v6
        with:
          name: comparison-integration
          path: build/comparison/integration
      - name: Enable emulator acceleration and prepare fixture encoder
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if ! command -v ffmpeg; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
      - name: Compare both builds on the same 2 GB Android TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash scripts/performance_compare.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: performance-comparison-results
          path: build/perf-comparison/
          retention-days: 14

  profile:
    if: inputs.workload == 'profile'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI_USE_DEBUG_SIGNING: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/gradle
      - name: Build the profile producer and target
        run: |
          printf '%s\n' 'NUVIO_SUPABASE_URL=http://127.0.0.1:38791/' 'NUVIO_SUPABASE_ANON_KEY=profile-fixture' > local.properties
          ./gradlew :app:assembleFullNonMinifiedRelease :baselineprofile:assembleNonMinifiedRelease --max-workers=2 -PuseLocalFfmpegDecoder=false -Pkotlin.compiler.execution.strategy=in-process
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Collect verified ReSeq journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 3072M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash scripts/collect_reseq_profile.sh
      - uses: actions/upload-artifact@v6
        with:
          name: reseq-generated-profile
          path: build/reseq-profile/*
          if-no-files-found: error

  emulator:
    if: inputs.workload == 'full' || inputs.workload == 'instrumentation'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        ram: ${{ fromJSON(inputs.ram_tiers) }}
    env:
      ANDROID_SERIAL: emulator-5554
      ANDROID_AVD_HOME: ${{ github.workspace }}/.stability-avd
      CI_USE_DEBUG_SIGNING: 'true'
      NUVIO_SPORTS_BASE_FEED_URL: http://127.0.0.1:38791/sports
    steps:
      - uses: actions/checkout@v6
      - name: Require Phase 1 tooling
        shell: bash
        run: |
          if [[ ! -f scripts/stability_smoke.py ]]; then
            echo '::error::Phase 1 tooling is missing. Dispatch with --ref codex/stability-phase1-tooling; do not dispatch against dev.'
            exit 1
          fi
      - uses: ./.github/actions/gradle
      - name: Prepare synthetic service configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path('local.properties').write_text(
              'NUVIO_SUPABASE_URL=http://127.0.0.1:38791/\n'
              'NUVIO_SUPABASE_ANON_KEY=stability-fixture-not-a-credential\n'
              'TRAKT_API_URL=http://127.0.0.1:38791/\n'
          )
          PY
      - name: Test launch-check guards
        run: python3 -m unittest scripts.tests.test_stability_smoke
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create disposable Android TV emulator
        shell: bash
        run: |
          sdkmanager 'emulator' 'system-images;android-34;android-tv;x86'
          python3 scripts/stability_avd.py --image "$ANDROID_HOME/system-images/android-34/android-tv/x86" --root "$ANDROID_AVD_HOME" --ram ${{ matrix.ram }}
          mkdir -p build/stability
          adb start-server
          # Fresh disposable CI guest only; never alter a physical device's authorisation.
          "$ANDROID_HOME/emulator/emulator" -avd stability-tv-${{ matrix.ram }} -port 5554 -memory ${{ matrix.ram }} -skip-adb-auth -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > build/stability/emulator.log 2>&1 &
          emulator_pid=$!
          booted=false
          for attempt in $(seq 1 150); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              tail -80 build/stability/emulator.log
              echo '::error::Disposable emulator exited before boot.'
              exit 1
            fi
            if [[ "$(adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" == 1 ]]; then booted=true; break; fi
            sleep 2
          done
          if [[ "$booted" != true ]]; then
            tail -80 build/stability/emulator.log
            adb devices -l
            echo '::error::Disposable emulator did not become boot-ready within 300 seconds.'
            exit 1
          fi
          python3 scripts/stability_fixtures.py > build/stability/fixture-server.log 2>&1 &
      - name: Build fixture APKs
        shell: bash
        run: |
          tasks=(:app:assembleFullDebug :app:assembleFullDebugAndroidTest)
          if [[ '${{ inputs.workload }}' == full ]]; then tasks+=(:app:assembleFullBenchmark); fi
          ./gradlew "${tasks[@]}" --max-workers=1 -PstabilityFixtures=true \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.jvmargs="${NUVIO_CI_JVM_ARGS:--Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8}"
      - name: Run minified fixture smoke, soak, cricket and timeline workloads
        if: ${{ inputs.workload == 'full' }}
        shell: bash
        run: |
          mapfile -t apks < <(find app/build/outputs/apk/full/benchmark -name '*-x86-benchmark.apk')
          test "${#apks[@]}" -eq 1
          python3 scripts/stability_run.py --device emulator --serial "$ANDROID_SERIAL" --apk "${apks[0]}" --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --output build/stability/journeys
      - name: Run existing instrumentation on the emulator
        # Live-account tests remain opt-in and are skipped with fresh fixture-only app data.
        if: ${{ !cancelled() && success() }}
        run: >-
          ./gradlew :app:connectedFullDebugAndroidTest --max-workers=1
          -PstabilityFixtures=true
          -Pkotlin.compiler.execution.strategy=in-process
          -Dorg.gradle.jvmargs="${NUVIO_CI_JVM_ARGS:--Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stability-tv-api34-${{ matrix.ram }}mb
          path: |
            build/stability/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/mapping/fullBenchmark/mapping.txt
          retention-days: 14
      - name: Stop disposable emulator
        if: always()
        run: adb -s "$ANDROID_SERIAL" emu kill || true
