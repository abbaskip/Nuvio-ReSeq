name: PR Full Debug Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev]
  push:
    branches: [dev]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'scripts/**'
      - 'tools/sports-feed/**'
      - '.github/actions/gradle/**'
      - '.github/workflows/pr-full-debug-build.yml'
  workflow_dispatch:
    inputs:
      build_apk:
        description: Also build and verify downloadable debug APKs
        type: boolean
        default: false
      comprehensive:
        description: Also run complete lint
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pr-full-debug-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-debug-build:
    name: Development regression checks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Prepare sanitised service inputs
        env:
          APP_CONFIG: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          BUILD_APK: ${{ inputs.build_apk }}
        run: |
          if [[ -n "$APP_CONFIG" ]]; then
            python3 scripts/ci_app_config.py --output local.properties
          else
            touch local.properties
          fi
          if [[ "$BUILD_APK" == true ]]; then test -n "$APP_CONFIG"; fi
      - name: Run development checks
        env:
          COMPREHENSIVE: ${{ inputs.comprehensive }}
          BUILD_APK: ${{ inputs.build_apk }}
        run: |
          lane=development
          if [[ "$COMPREHENSIVE" == true ]]; then lane=validate; fi
          args=()
          if [[ "$BUILD_APK" == true ]]; then args+=(--apk); fi
          python3 scripts/ci_pipeline.py "$lane" "${args[@]}"
      - name: Verify actual debug APK services before sharing
        if: inputs.build_apk
        env:
          APP_CONFIG: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
        run: python3 scripts/verify_apk_services.py --properties local.properties --apk-dir app/build/outputs/apk/full/debug --report build/pipeline/debug-services.json
      - name: Upload fullDebug APK
        if: inputs.build_apk
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/full/debug/app-full-universal-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: Encrypt task cache
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        env:
          NUVIO_CACHE_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        run: bash scripts/ci-cache.sh save
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pipeline-development-timings
          path: |
            build/pipeline/*.json
            build/reports/profile/*
          retention-days: 14
      - name: Remove service inputs
        if: always()
        run: rm -f local.properties local.dev.properties
