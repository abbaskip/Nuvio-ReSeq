name: Stability emulator verification

# Deliberately independent of publication. Dispatch after the Phase 1 base is agreed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        ram: [2048, 3072, 4096]
    env:
      ANDROID_SERIAL: emulator-5554
      ANDROID_AVD_HOME: ${{ runner.temp }}/stability-avd
      CI_USE_DEBUG_SIGNING: 'true'
      NUVIO_SPORTS_BASE_FEED_URL: http://127.0.0.1:38791/sports
    steps:
      - uses: actions/checkout@v6
      - name: Require Phase 1 tooling
        shell: bash
        run: |
          if [[ ! -f scripts/stability_smoke.py ]]; then
            echo '::error::Phase 1 tooling is missing. Dispatch with --ref codex/stability-phase1-tooling; do not dispatch against dev.'
            exit 1
          fi
      - uses: ./.github/actions/gradle
      - name: Prepare synthetic service configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path('local.properties').write_text(
              'NUVIO_SUPABASE_URL=http://127.0.0.1:38791/\n'
              'NUVIO_SUPABASE_ANON_KEY=stability-fixture-not-a-credential\n'
              'TRAKT_API_URL=http://127.0.0.1:38791/\n'
          )
          PY
      - name: Test launch-check guards
        run: python3 -m unittest scripts.tests.test_stability_smoke
      - name: Build minified benchmark and existing instrumentation
        run: >-
          ./gradlew :app:assembleFullBenchmark :app:assembleFullDebug
          :app:assembleFullDebugAndroidTest --max-workers=1
          -PstabilityFixtures=true
          -Pkotlin.compiler.execution.strategy=in-process
          -Dorg.gradle.jvmargs="${NUVIO_CI_JVM_ARGS:--Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8}"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create disposable Android TV emulator
        shell: bash
        run: |
          sdkmanager 'emulator' 'system-images;android-34;android-tv;x86'
          python3 scripts/stability_avd.py --image "$ANDROID_HOME/system-images/android-34/android-tv/x86" --root "$ANDROID_AVD_HOME" --ram ${{ matrix.ram }}
          mkdir -p build/stability
          "$ANDROID_HOME/emulator/emulator" -avd stability-tv-${{ matrix.ram }} -port 5554 -memory ${{ matrix.ram }} -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > build/stability/emulator.log 2>&1 &
          timeout 180 adb -s "$ANDROID_SERIAL" wait-for-device
          booted=false
          for attempt in $(seq 1 120); do
            if [[ "$(adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]; then booted=true; break; fi
            sleep 2
          done
          test "$booted" = true
          python3 scripts/stability_fixtures.py > build/stability/fixture-server.log 2>&1 &
      - name: Run minified fixture smoke, soak, cricket and timeline workloads
        shell: bash
        run: |
          mapfile -t apks < <(find app/build/outputs/apk/full/benchmark -name '*-x86-benchmark.apk')
          test "${#apks[@]}" -eq 1
          python3 scripts/stability_run.py --device emulator --serial "$ANDROID_SERIAL" --apk "${apks[0]}" --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --output build/stability/journeys
      - name: Run existing instrumentation on the emulator
        # Live-account tests remain opt-in and are skipped with fresh fixture-only app data.
        if: ${{ !cancelled() && success() }}
        run: >-
          ./gradlew :app:connectedFullDebugAndroidTest --max-workers=1
          -PstabilityFixtures=true
          -Pkotlin.compiler.execution.strategy=in-process
          -Dorg.gradle.jvmargs="${NUVIO_CI_JVM_ARGS:--Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stability-tv-api34-${{ matrix.ram }}mb
          path: |
            build/stability/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/mapping/fullBenchmark/mapping.txt
          retention-days: 14
      - name: Stop disposable emulator
        if: always()
        run: adb -s "$ANDROID_SERIAL" emu kill || true
