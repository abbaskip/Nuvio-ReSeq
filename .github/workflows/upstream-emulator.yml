name: Upstream candidate emulator
on:
  push:
    branches: [automation/sydney-sync-host]
    paths: [automation/emulator-candidate.txt, automation/emulator-base.txt, .github/workflows/upstream-emulator.yml]
permissions:
  contents: read
jobs:
  emulator:
    strategy:
      fail-fast: false
      matrix:
        revision: [candidate, base]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check out the preserved candidate
        run: |
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          candidate=$(git show FETCH_HEAD:automation/emulator-${{ matrix.revision }}.txt)
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$candidate"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$candidate"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Build fixture-only instrumentation
        run: |
          printf '%s\n' 'NUVIO_SUPABASE_URL=https://fixture.invalid' 'NUVIO_SUPABASE_ANON_KEY=unused-fixture-only' > local.dev.properties
          ./gradlew :app:assembleFullDebug :app:assembleFullDebugAndroidTest -PuseLocalFfmpegDecoder=false --max-workers=2
      - name: Allow this runner to use its virtual CPU
        run: sudo setfacl -m u:"$(id -un)":rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c
        with:
          api-level: 34
          arch: x86
          profile: tv_1080p
          target: android-tv
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -skin 1920x1080
          script: ./gradlew :app:connectedFullDebugAndroidTest -PuseLocalFfmpegDecoder=false --max-workers=2 -Pandroid.testInstrumentationRunnerArguments.class=com.nuvio.tv.ui.screens.settings.PlaybackSettingsOrganizationTest,com.nuvio.tv.ui.screens.player.UpstreamSourceChipFocusTvTest,com.nuvio.tv.livetv.ui.LiveTvOrderDialogTest,com.nuvio.tv.ui.screens.home.TvMixHomeTvTest,com.nuvio.tv.ui.screens.detail.EpisodeShuffleTvTest
      - name: Require nonempty passing instrumentation results
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          results = [ET.parse(p).getroot() for p in Path('app/build/outputs/androidTest-results').rglob('TEST-*.xml')]
          cases = [case for root in results for case in root.iter('testcase')]
          assert cases and all(case.find('failure') is None and case.find('error') is None for case in cases)
          executed = [case for case in cases if case.find('skipped') is None]
          names = {case.get('classname', '').split('.')[-1] for case in executed}
          assert {'PlaybackSettingsOrganizationTest', 'UpstreamSourceChipFocusTvTest', 'LiveTvOrderDialogTest', 'TvMixHomeTvTest', 'EpisodeShuffleTvTest'} <= names, names
          print(f'{len(executed)} fixture tests passed on the hosted emulator')
          PY
