name: Stability emulator verification

# Deliberately independent of publication. Dispatch after the Phase 1 base is agreed.
on:
  workflow_dispatch:
    inputs:
      workload:
        description: 'Full baseline or existing instrumentation only'
        type: choice
        default: full
        options: [full, instrumentation, profile, compare, regressions, followup, playback, recording]
      ram_tiers:
        description: 'RAM tiers in MB; select one to repeat a failed tier'
        type: choice
        default: '[2048,3072,4096]'
        options:
          - '[2048,3072,4096]'
          - '[2048]'
          - '[3072]'
          - '[4096]'

permissions:
  contents: read

jobs:
  regressions:
    if: inputs.workload == 'regressions' || inputs.workload == 'followup' || inputs.workload == 'playback' || inputs.workload == 'recording'
    runs-on: ubuntu-latest
    timeout-minutes: 115
    strategy:
      fail-fast: false
      matrix:
        side: [published, integration]
    env:
      CI_USE_DEBUG_SIGNING: 'true'
      PERF_DEVICE_WORKLOAD: ${{ inputs.workload }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use the published application and all of its original tests
        if: matrix.side == 'published'
        run: |
          git checkout --detach v0.1.0-beta.10.12
          git show "$GITHUB_SHA:scripts/performance_regressions.sh" > scripts/performance_regressions.sh
          git show "$GITHUB_SHA:scripts/performance_state_playback.sh" > scripts/performance_state_playback.sh
          git show "$GITHUB_SHA:scripts/stability_run.py" > scripts/stability_run.py
          fixture=app/src/stabilityFixtures/java/com/nuvio/tv/profiling/StabilityJourneyActivity.kt
          git show "$GITHUB_SHA:$fixture" > "$fixture"
      - name: Prepare the identical synthetic recording for both apps
        if: inputs.workload == 'recording'
        run: |
          testsrc=app/src/androidTest/java/com/nuvio/tv/livetv/storage/ClosedRecordingDeviceTest.kt
          git show "$GITHUB_SHA:scripts/performance-fixtures/ClosedRecordingDeviceTest.kt" > "$testsrc"
          mkdir -p app/src/androidTest/assets
          if ! command -v ffmpeg; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=160x96:rate=10 -t 10 -an -c:v libx264 -threads 1 -g 20 -pix_fmt yuv420p -f mpegts app/src/androidTest/assets/closed-recording.ts
      - uses: ./.github/actions/gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Build isolated fixture app and on-device tests
        run: |
          tasks=(:app:assembleFullBenchmark)
          if [[ "$PERF_DEVICE_WORKLOAD" == regressions ]]; then tasks+=(:app:assembleFullDebug :app:assembleFullDebugAndroidTest); fi
          if [[ "$PERF_DEVICE_WORKLOAD" == recording ]]; then tasks=(:app:assembleFullDebug :app:assembleFullDebugAndroidTest); fi
          ./gradlew "${tasks[@]}" --max-workers=2 -PstabilityFixtures=true -PuseLocalFfmpegDecoder=false -Pkotlin.compiler.execution.strategy=in-process
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Continue Watching, TVDB and Sports journeys and device regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash scripts/performance_regressions.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: performance-regression-results-${{ matrix.side }}
          path: |
            build/performance-regressions/
            app/build/outputs/androidTest-results/
          retention-days: 14

  comparison-build:
    if: inputs.workload == 'compare'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        side: [published, integration]
    env:
      CI_USE_DEBUG_SIGNING: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select application revision and identical fixture activity
        if: matrix.side == 'published'
        run: |
          fixture=app/src/profileFixtures/java/com/nuvio/tv/profiling/ReSeqJourneyActivity.kt
          git checkout --detach 'v0.1.0-beta.10.12'
          git show "$GITHUB_SHA:$fixture" > "$fixture"
      - uses: ./.github/actions/gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Build minified non-debuggable comparison and runner
        run: |
          # Use a separate application ID on both sides so the same builds can run alongside a populated release on a TV.
          sed -i 's/applicationId = "io.github.abbaskip.nuvioreseq"/applicationId = "io.github.abbaskip.nuvioreseq.perfcomparison"/' app/build.gradle.kts
          sed -i 's/DEFAULT_TARGET_PACKAGE = "io.github.abbaskip.nuvioreseq"/DEFAULT_TARGET_PACKAGE = "io.github.abbaskip.nuvioreseq.perfcomparison"/' baselineprofile/src/main/java/com/nuvio/tv/baselineprofile/NuvioUi.kt
          grep -Fq 'applicationId = "io.github.abbaskip.nuvioreseq.perfcomparison"' app/build.gradle.kts
          printf '%s\n' 'NUVIO_SUPABASE_URL=http://127.0.0.1:38791/' 'NUVIO_SUPABASE_ANON_KEY=comparison-fixture' > local.properties
          ./gradlew :app:assembleFullBenchmarkRelease :baselineprofile:assembleBenchmarkRelease --max-workers=2 -PuseLocalFfmpegDecoder=false -Pkotlin.compiler.execution.strategy=in-process
          mkdir -p build/comparison-output
          mapfile -t target < <(find app/build/outputs/apk -name '*-x86-benchmarkRelease.apk')
          mapfile -t runner < <(find baselineprofile/build/outputs/apk -name '*-benchmarkRelease.apk')
          test "${#target[@]}" = 1 && test "${#runner[@]}" = 1
          cp "${target[0]}" build/comparison-output/target.apk
          cp "${runner[0]}" build/comparison-output/runner.apk
          mapfile -t arm < <(find app/build/outputs/apk -name '*-armeabi-v7a-benchmarkRelease.apk')
          test "${#arm[@]}" = 1
          mkdir -p build/comparison-arm
          cp "${arm[0]}" build/comparison-arm/target.apk
          echo "$GITHUB_SHA" > build/comparison-arm/workflow-revision.txt
          git rev-parse HEAD > build/comparison-arm/application-revision.txt
      - uses: actions/upload-artifact@v6
        with:
          name: comparison-arm-${{ matrix.side }}
          path: build/comparison-arm/
          retention-days: 2
          compression-level: 0
      - uses: actions/upload-artifact@v6
        with:
          name: comparison-${{ matrix.side }}
          path: build/comparison-output/
          retention-days: 1
          compression-level: 0

  comparison:
    needs: comparison-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: comparison-published
          path: build/comparison/published
      - uses: actions/download-artifact@v6
        with:
          name: comparison-integration
          path: build/comparison/integration
      - name: Enable emulator acceleration and prepare fixture encoder
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if ! command -v ffmpeg; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
      - name: Compare both builds on the same 2 GB Android TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash scripts/performance_compare.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: performance-comparison-results
          path: build/perf-comparison/
          retention-days: 14

  profile:
    if: inputs.workload == 'profile'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI_USE_DEBUG_SIGNING: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/gradle
      - name: Build the profile producer and target
        run: |
          printf '%s\n' 'NUVIO_SUPABASE_URL=http://127.0.0.1:38791/' 'NUVIO_SUPABASE_ANON_KEY=profile-fixture' > local.properties
          ./gradlew :app:assembleFullNonMinifiedRelease :baselineprofile:assembleNonMinifiedRelease --max-workers=2 -PuseLocalFfmpegDecoder=false -Pkotlin.compiler.execution.strategy=in-process
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Collect verified ReSeq journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 3072M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash scripts/collect_reseq_profile.sh
      - uses: actions/upload-artifact@v6
        with:
          name: reseq-generated-profile
          path: build/reseq-profile/*
          if-no-files-found: error

  emulator:
    if: inputs.workload == 'full' || inputs.workload == 'instrumentation'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        ram: ${{ fromJSON(inputs.ram_tiers) }}
    env:
      ANDROID_SERIAL: emulator-5554
      ANDROID_AVD_HOME: ${{ github.workspace }}/.stability-avd
      CI_USE_DEBUG_SIGNING: 'true'
      NUVIO_SPORTS_BASE_FEED_URL: http://127.0.0.1:38791/sports
    steps:
      - uses: actions/checkout@v6
      - name: Require Phase 1 tooling
        shell: bash
        run: |
          if [[ ! -f scripts/stability_smoke.py ]]; then
            echo '::error::Phase 1 tooling is missing. Dispatch with --ref codex/stability-phase1-tooling; do not dispatch against dev.'
            exit 1
          fi
      - uses: ./.github/actions/gradle
      - name: Prepare synthetic service configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path('local.properties').write_text(
              'NUVIO_SUPABASE_URL=http://127.0.0.1:38791/\n'
              'NUVIO_SUPABASE_ANON_KEY=stability-fixture-not-a-credential\n'
              'TRAKT_API_URL=http://127.0.0.1:38791/\n'
          )
          PY
      - name: Test launch-check guards
        run: python3 -m unittest scripts.tests.test_stability_smoke
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create disposable Android TV emulator
        shell: bash
        run: |
          sdkmanager 'emulator' 'system-images;android-34;android-tv;x86'
          python3 scripts/stability_avd.py --image "$ANDROID_HOME/system-images/android-34/android-tv/x86" --root "$ANDROID_AVD_HOME" --ram ${{ matrix.ram }}
          mkdir -p build/stability
          adb start-server
          # Fresh disposable CI guest only; never alter a physical device's authorisation.
          "$ANDROID_HOME/emulator/emulator" -avd stability-tv-${{ matrix.ram }} -port 5554 -memory ${{ matrix.ram }} -skip-adb-auth -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > build/stability/emulator.log 2>&1 &
          emulator_pid=$!
          booted=false
          for attempt in $(seq 1 150); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              tail -80 build/stability/emulator.log
              echo '::error::Disposable emulator exited before boot.'
              exit 1
            fi
            if [[ "$(adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" == 1 ]]; then booted=true; break; fi
            sleep 2
          done
          if [[ "$booted" != true ]]; then
            tail -80 build/stability/emulator.log
            adb devices -l
            echo '::error::Disposable emulator did not become boot-ready within 300 seconds.'
            exit 1
          fi
          python3 scripts/stability_fixtures.py > build/stability/fixture-server.log 2>&1 &
      - name: Build fixture APKs
        shell: bash
        run: |
          tasks=(:app:assembleFullDebug :app:assembleFullDebugAndroidTest)
          if [[ '${{ inputs.workload }}' == full ]]; then tasks+=(:app:assembleFullBenchmark); fi
          ./gradlew "${tasks[@]}" --max-workers=1 -PstabilityFixtures=true \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.jvmargs="${NUVIO_CI_JVM_ARGS:--Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8}"
      - name: Run minified fixture smoke, soak, cricket and timeline workloads
        if: ${{ inputs.workload == 'full' }}
        shell: bash
        run: |
          mapfile -t apks < <(find app/build/outputs/apk/full/benchmark -name '*-x86-benchmark.apk')
          test "${#apks[@]}" -eq 1
          python3 scripts/stability_run.py --device emulator --serial "$ANDROID_SERIAL" --apk "${apks[0]}" --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --output build/stability/journeys
      - name: Run existing instrumentation on the emulator
        # Live-account tests remain opt-in and are skipped with fresh fixture-only app data.
        if: ${{ !cancelled() && success() }}
        run: >-
          ./gradlew :app:connectedFullDebugAndroidTest --max-workers=1
          -PstabilityFixtures=true
          -Pkotlin.compiler.execution.strategy=in-process
          -Dorg.gradle.jvmargs="${NUVIO_CI_JVM_ARGS:--Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stability-tv-api34-${{ matrix.ram }}mb
          path: |
            build/stability/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/mapping/fullBenchmark/mapping.txt
          retention-days: 14
      - name: Stop disposable emulator
        if: always()
        run: adb -s "$ANDROID_SERIAL" emu kill || true
