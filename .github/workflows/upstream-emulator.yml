name: Upstream candidate emulator
on:
  push:
    branches: [automation/sydney-sync-host]
    paths: [automation/emulator-candidate.txt, automation/emulator-base.txt, .github/workflows/upstream-emulator.yml]
permissions:
  contents: read
jobs:
  emulator:
    strategy:
      fail-fast: false
      matrix:
        revision: [candidate, base]
        include:
          - revision: mobile
            marker: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check out the preserved candidate
        run: |
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          candidate=$(git show FETCH_HEAD:automation/emulator-${{ matrix.marker || matrix.revision }}.txt)
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$candidate"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$candidate"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Build fixture-only instrumentation
        run: |
          printf '%s\n' 'NUVIO_SUPABASE_URL=https://fixture.invalid' 'NUVIO_SUPABASE_ANON_KEY=unused-fixture-only' > local.dev.properties
          if [[ "${{ matrix.revision }}" == "mobile" ]]; then
            ./gradlew :app:assembleMobileDebug :app:testMobileDebugUnitTest --init-script scripts/ci.gradle -PuseLocalFfmpegDecoder=false -Pkotlin.compiler.execution.strategy=in-process --max-workers=2
          else
            ./gradlew :app:assembleFullDebug :app:assembleFullDebugAndroidTest -PuseLocalFfmpegDecoder=false --max-workers=2
          fi
      - name: Allow this runner to use its virtual CPU
        run: sudo setfacl -m u:"$(id -un)":rw /dev/kvm
      - name: Select TV fixture classes present at the pinned revision
        if: matrix.revision != 'mobile'
        run: |
          classes='com.nuvio.tv.ui.screens.settings.PlaybackSettingsOrganizationTest,com.nuvio.tv.ui.screens.player.UpstreamSourceChipFocusTvTest,com.nuvio.tv.livetv.ui.LiveTvOrderDialogTest,com.nuvio.tv.ui.screens.home.TvMixHomeTvTest,com.nuvio.tv.ui.screens.detail.EpisodeShuffleTvTest'
          for suite in com.nuvio.tv.livetv.data.EpgTitleSearchTest com.nuvio.tv.livetv.ui.GuideSearchDialogTvTest com.nuvio.tv.ui.screens.detail.TrailerHandoffTvTest com.nuvio.tv.livetv.sports.SportsMatchCentreTvTest; do
            if [[ -f "app/src/androidTest/java/${suite//.//}.kt" ]]; then classes+=",$suite"; fi
          done
          echo "TV_TEST_CLASSES=$classes" >> "$GITHUB_ENV"
      - if: matrix.revision != 'mobile'
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c
        with:
          api-level: 34
          arch: x86
          profile: tv_1080p
          target: android-tv
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -skin 1920x1080
          script: ./gradlew :app:connectedFullDebugAndroidTest -PuseLocalFfmpegDecoder=false --max-workers=2 -Pandroid.testInstrumentationRunnerArguments.class="$TV_TEST_CLASSES"
      - name: Run mobile touch acceptance with loopback services
        if: matrix.revision == 'mobile'
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            # Keep a default Android network for catalogue journeys. Only loopback fixtures are reachable.
            adb -s emulator-5554 root
            adb -s emulator-5554 wait-for-device
            adb -s emulator-5554 shell settings put global captive_portal_mode 0
            adb -s emulator-5554 shell iptables -I OUTPUT ! -o lo -j REJECT
            adb -s emulator-5554 shell ip6tables -I OUTPUT ! -o lo -j REJECT
            adb -s emulator-5554 shell iptables -C OUTPUT ! -o lo -j REJECT
            adb -s emulator-5554 shell ip6tables -C OUTPUT ! -o lo -j REJECT
            python3 scripts/mobile_smoke.py --extended --apk app/build/outputs/apk/mobile/debug/app-mobile-x86_64-debug.apk
      - name: Require nonempty passing instrumentation results
        if: matrix.revision != 'mobile'
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          results = [ET.parse(p).getroot() for p in Path('app/build/outputs/androidTest-results').rglob('TEST-*.xml')]
          cases = [case for root in results for case in root.iter('testcase')]
          assert cases and all(case.find('failure') is None and case.find('error') is None for case in cases)
          executed = [case for case in cases if case.find('skipped') is None]
          names = {case.get('classname', '').split('.')[-1] for case in executed}
          assert {'PlaybackSettingsOrganizationTest', 'UpstreamSourceChipFocusTvTest', 'LiveTvOrderDialogTest', 'TvMixHomeTvTest', 'EpisodeShuffleTvTest'} <= names, names
          import os
          expected = {name.split('.')[-1] for name in os.environ['TV_TEST_CLASSES'].split(',')}
          assert expected <= names, expected - names
          print(f'{len(executed)} fixture tests passed on the hosted emulator')
          PY
