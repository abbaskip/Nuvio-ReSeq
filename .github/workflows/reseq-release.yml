name: ReSeq signed APK release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after validation (otherwise create a draft)
        type: boolean
        default: false
      notes:
        description: Repository path to reviewed release notes
        type: string
        required: true
      artifacts_only:
        description: Validate and build verified artifacts without changing any release or tag
        type: boolean
        default: false
      device_tests:
        description: Also build configured debug and instrumentation APKs (does not run an emulator)
        type: boolean
        default: false

permissions:
  contents: read

# Artifact rehearsals do not sit behind a publication or block unrelated branches.
# Publications retain the existing global serialization and are never cancelled.
concurrency:
  group: ${{ inputs.artifacts_only && format('reseq-artifacts-{0}', github.ref) || 'reseq-release' }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve version and reject duplicate releases
        id: version
        env:
          ARTIFACTS_ONLY: ${{ inputs.artifacts_only }}
        run: |
          if [[ "$ARTIFACTS_ONLY" != true ]]; then
            python3 -c "from pathlib import Path; from scripts.upstream_sync import assert_release_allowed; assert_release_allowed(Path('.'))"
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path
          text = Path('app/build.gradle.kts').read_text(encoding='utf-8-sig')
          version = re.search(r'versionName\s*=\s*"([^"]+)"', text)[1]
          print(f'name={version}')
          print(f'tag=v{version}')
          PY
          tag="$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT" | tail -1)"
          if [[ "$ARTIFACTS_ONLY" != true ]] && { git rev-parse --verify --quiet "refs/tags/$tag" || gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; }; then
            echo "Release/tag already exists: $tag" >&2
            exit 1
          fi
      - name: Check reviewed notes before spending build time
        env:
          NOTES_PATH: ${{ inputs.notes }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path.cwd().resolve()
          notes = (root / os.environ['NOTES_PATH']).resolve()
          if not notes.is_relative_to(root) or not notes.is_file():
              raise SystemExit('Release notes must be an existing repository file')
          PY

  validate:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/gradle
        id: gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Prepare approved services
        env:
          APP_CONFIG: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
        run: |
          test -n "$APP_CONFIG"
          python3 scripts/ci_app_config.py --output local.properties
      - name: Full regressions and complete lint
        env:
          DEVICE_APKS: ${{ inputs.device_tests }}
        run: |
          args=()
          if [[ "$DEVICE_APKS" == true ]]; then args+=(--device-apks); fi
          python3 scripts/ci_pipeline.py validate "${args[@]}"
      - name: Verify configured test APKs
        if: inputs.device_tests
        env:
          APP_CONFIG: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
        run: |
          python3 scripts/verify_apk_services.py --properties local.properties --apk-dir app/build/outputs/apk/full/debug --report build/debug-service-verification.json
          python3 scripts/verify_apk_services.py --properties local.properties --apk-dir app/build/outputs/apk/androidTest/full/debug --backend-only --report build/test-service-verification.json
      - uses: actions/upload-artifact@v6
        if: inputs.device_tests
        with:
          name: ReSeq-${{ needs.preflight.outputs.name }}-device-tests
          compression-level: 0
          path: |
            app/build/outputs/apk/full/debug/*.apk
            app/build/outputs/apk/androidTest/full/debug/*.apk
            build/debug-service-verification.json
            build/test-service-verification.json
          if-no-files-found: error
      - name: Encrypt task cache
        id: encrypt-cache
        continue-on-error: true
        if: ${{ !cancelled() }}
        env:
          NUVIO_CACHE_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        run: bash scripts/ci-cache.sh save
      - name: Save encrypted task cache, including after failed checks
        if: ${{ !cancelled() && steps.encrypt-cache.outcome == 'success' && steps.gradle.outputs.task-cache-key != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/nuvio-task-cache
          key: ${{ steps.gradle.outputs.task-cache-key }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pipeline-validation-timings
          path: |
            build/pipeline/*.json
            build/reports/profile/*
          retention-days: 14
      - name: Remove service inputs
        if: always()
        run: rm -f local.properties local.dev.properties

  release:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/gradle
        id: gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Configure permanent signing and app services
        env:
          APP_CONFIG: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          KEYSTORE: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
        run: |
          test -n "$APP_CONFIG" && test -n "$KEYSTORE" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" && test -n "$STORE_PASSWORD"
          python3 scripts/ci_app_config.py --output local.properties
          for property in GOOGLE_DRIVE_CLIENT_ID GOOGLE_DRIVE_CLIENT_SECRET NUVIO_SUPABASE_URL NUVIO_SUPABASE_ANON_KEY TRAKT_CLIENT_ID SIMKL_CLIENT_ID MDBLIST_CLIENT_ID; do
            grep -Eq "^${property}=.+" local.properties || { echo "Missing required service configuration: $property" >&2; exit 1; }
          done
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/reseq.jks"
          echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/reseq.jks" >> "$GITHUB_ENV"
          echo "NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NUVIO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "NUVIO_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Build optimised signed release APKs
        run: python3 scripts/ci_pipeline.py release
      - name: Verify signing, upgrade identity and native libraries
        env:
          VERSION: ${{ needs.preflight.outputs.name }}
          APP_CONFIG: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          ARTIFACTS_ONLY: ${{ inputs.artifacts_only }}
        run: |
          mkdir -p build/previous-release
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*universal.apk' --dir build/previous-release
          mapfile -t previous < <(find build/previous-release -name '*.apk')
          test "${#previous[@]}" -eq 1
          tools="$ANDROID_HOME/build-tools/36.0.0"
          test_args=()
          if [[ "$ARTIFACTS_ONLY" == true ]]; then test_args+=(--allow-same-version); fi
          python3 scripts/prepare_release_apks.py --apk-dir app/build/outputs/apk/full/release --output-dir build/release --version "$VERSION" --apksigner "$tools/apksigner" --aapt "$tools/aapt" --reference-apk "${previous[0]}" "${test_args[@]}"
          python3 scripts/verify_cs3_runtime.py build/release/*-universal.apk
          python3 scripts/verify_apk_services.py --properties local.properties --apk-dir build/release --report build/service-verification.json
          cp build/service-verification.json build/release/service-verification.json
      - name: Assemble reviewed notes and download guidance
        env:
          NOTES_PATH: ${{ inputs.notes }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path.cwd().resolve()
          notes = (root / os.environ['NOTES_PATH']).resolve()
          if not notes.is_relative_to(root) or not notes.is_file():
              raise SystemExit('Release notes must be an existing repository file')
          Path('build/release-notes.md').write_text(notes.read_text() + '\n\n' + Path('build/release/DOWNLOADS.md').read_text())
          PY
      - name: Preserve reviewed notes with the exact artifacts
        run: cp build/release-notes.md build/release/release-notes.md
      - uses: actions/upload-artifact@v6
        with:
          name: ReSeq-${{ needs.preflight.outputs.name }}-verified-apks
          compression-level: 0
          path: build/release/*
          if-no-files-found: error
      - name: Retain exact release crash symbols
        uses: actions/upload-artifact@v6
        with:
          name: ReSeq-${{ needs.preflight.outputs.name }}-r8-mapping
          path: app/build/outputs/mapping/fullRelease/mapping.txt
          if-no-files-found: error
      - name: Encrypt task cache
        id: encrypt-cache
        continue-on-error: true
        if: ${{ !cancelled() }}
        env:
          NUVIO_CACHE_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        run: bash scripts/ci-cache.sh save
      - name: Save encrypted task cache, including after failed checks
        if: ${{ !cancelled() && steps.encrypt-cache.outcome == 'success' && steps.gradle.outputs.task-cache-key != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/nuvio-task-cache
          key: ${{ steps.gradle.outputs.task-cache-key }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pipeline-release-timings
          path: |
            build/pipeline/*.json
            build/reports/profile/*
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/reseq.jks" local.properties local.dev.properties

  publish:
    needs: [preflight, validate, release]
    if: ${{ !inputs.artifacts_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Recheck publication hold after validation
        run: python3 -c "from pathlib import Path; from scripts.upstream_sync import assert_release_allowed; assert_release_allowed(Path('.'))"
      - uses: actions/download-artifact@v6
        with:
          name: ReSeq-${{ needs.preflight.outputs.name }}-verified-apks
          path: build/release
      - name: Verify artifact transport
        working-directory: build/release
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish one release from this exact commit
        if: ${{ !inputs.artifacts_only }}
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.name }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          args=("$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Nuvio ReSeq $VERSION" --notes-file build/release/release-notes.md)
          # Stage all assets in a draft; old updaters must see x86 before x86_64.
          # Upload serially because parallel uploads can reorder GitHub's asset list.
          gh release create "${args[@]}" --draft
          for abi in universal armeabi-v7a arm64-v8a x86 x86_64; do
            gh release upload "$TAG" "build/release/Nuvio-ReSeq-v$VERSION-$abi.apk" --repo "$GITHUB_REPOSITORY"
          done
          gh release upload "$TAG" build/release/SHA256SUMS.txt build/release/DOWNLOADS.md --repo "$GITHUB_REPOSITORY"
          # ReSeq has one update channel; beta-labelled versions are regular releases.
          if [[ "$PUBLISH" == true ]]; then
            gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
          fi
